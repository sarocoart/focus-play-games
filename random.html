<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아장아장 아기 따라가기</title>
<style>
  :root{
    --bg:      #F9EFE2;
    --panel:   #FFFDF6;
    --ink:     #4A3B2A;
    --ink-soft:#8A7A64;
    --accent:  #E39A3B;
    --accent2: #7FA86B;
    --chip:    #FFF6E6;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .screen{ display:none; width:100%; height:100%; }
  .screen.on{ display:flex; }

  /* ── 홈 / 설정 / 결과 공통 카드 ── */
  .card-wrap{ align-items:center; justify-content:center; padding:16px; }
  .card{
    background:var(--panel); border-radius:24px; padding:18px 30px;
    width:min(560px, 94vw); max-height:96vh; overflow-y:auto;
    box-shadow:0 8px 28px rgba(90,70,40,.14); text-align:center;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .card::-webkit-scrollbar{ display:none; width:0; height:0; }
  .home-icon{ font-size:56px; letter-spacing:6px; }
  h1{ font-size:30px; margin:6px 0 4px; }
  .sub{ font-size:17px; color:var(--ink-soft); line-height:1.45; margin-bottom:10px; }
  .sub b{ color:var(--ink); }

  .row-label{ font-size:15px; color:var(--ink-soft); margin:8px 0 4px; text-align:left; }
  .choice-row{ display:flex; gap:8px; }
  .choice{
    flex:1; padding:9px 4px; border-radius:14px; border:2px solid #E8DCC6;
    background:var(--chip); font-size:16px; color:var(--ink); cursor:pointer;
    font-family:inherit;
  }
  .choice.sel{ border-color:var(--accent); background:#FDEBD0; font-weight:bold; }

  .big-btn{
    display:block; width:100%; margin-top:8px; padding:13px;
    border:none; border-radius:16px; font-size:20px; font-weight:bold;
    cursor:pointer; font-family:inherit; color:#fff;
  }
  .btn-start{ background:var(--accent2); }
  .btn-tune { background:var(--accent); font-size:17px; padding:11px; }
  .btn-soft {
    background:var(--chip); color:var(--ink); border:2px solid #E8DCC6;
    font-size:16px; padding:10px; font-weight:normal;
  }
  .focus-note{ font-size:14px; color:var(--ink-soft); margin-top:5px; min-height:18px; }

  .disclaimer{
    margin-top:10px; font-size:12px; color:#A99A85; line-height:1.5;
    border-top:1px dashed #E4D7C0; padding-top:8px; text-align:left;
  }

  /* ── 게임 화면 ── */
  #scr-game{ position:relative; background:var(--bg); }
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hud{
    position:absolute; top:10px; left:0; right:0;
    display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
    pointer-events:none; z-index:3; padding:0 8px;
  }
  .hud .chip{
    background:rgba(255,253,246,.92); border:1.5px solid #E8DCC6;
    border-radius:999px; padding:7px 14px; font-size:16px; font-weight:bold;
    color:var(--ink); box-shadow:0 2px 8px rgba(90,70,40,.10);
    white-space:nowrap;
  }
  .hud .chip small{ font-weight:normal; color:var(--ink-soft); }
  #toast{
    position:absolute; top:64px; left:50%; transform:translateX(-50%);
    background:rgba(74,59,42,.85); color:#FFF8EC; border-radius:14px;
    padding:10px 18px; font-size:17px; z-index:4; pointer-events:none;
    max-width:92vw; text-align:center; overflow-wrap:break-word;
    opacity:0; transition:opacity .4s;
  }
  #toast.show{ opacity:1; }
  #btn-quit{
    position:absolute; right:12px; bottom:12px; z-index:3;
    background:rgba(255,253,246,.92); border:1.5px solid #E8DCC6;
    border-radius:999px; padding:9px 16px; font-size:15px; color:var(--ink-soft);
    cursor:pointer; font-family:inherit;
  }

  .result-icon{ font-size:60px; }
  .score-line{ font-size:22px; margin:14px 0 4px; }
  .score-line b{ color:var(--accent); font-size:30px; }
</style>
</head>
<body>

<!-- ══════════ 홈 화면 ══════════ -->
<div class="screen card-wrap on" id="scr-home">
  <div class="card">
    <div class="home-icon" id="home-icon"></div>
    <h1 id="home-title"></h1>
    <p class="sub" id="home-sub"></p>

    <div class="row-label">🐢 빠르기</div>
    <div class="choice-row" id="row-speed">
      <button class="choice" data-v="slow">천천히</button>
      <button class="choice sel" data-v="mid">보통</button>
      <button class="choice" data-v="fast">빠르게</button>
    </div>

    <div class="row-label">⏱️ 놀이 시간</div>
    <div class="choice-row" id="row-time">
      <button class="choice sel" data-v="60">1분</button>
      <button class="choice" data-v="120">2분</button>
    </div>

    <button class="big-btn btn-tune" id="btn-tune">🧭 1분 게임 맞춤 설정</button>
    <div class="focus-note" id="focus-note"></div>
    <button class="big-btn btn-start" id="btn-start">▶ 시작하기</button>

    <p class="disclaimer" id="disclaimer"></p>
  </div>
</div>

<!-- ══════════ 맞춤 설정 화면 ══════════ -->
<div class="screen card-wrap" id="scr-tune">
  <div class="card">
    <div class="home-icon">🧭</div>
    <h1>게임 맞춤 설정</h1>
    <p class="sub">스트레칭했을 때의 <b>느낌</b>을 알려주세요.<br>게임 움직임이 나에게 맞게 조절됩니다.</p>
    <div class="row-label">양팔을 위로 쭉 뻗었을 때, 어느 쪽이 더 뻣뻣하게 느껴지나요?</div>
    <div class="choice-row" style="margin-top:6px;">
      <button class="choice" id="tune-left">👈 왼쪽</button>
      <button class="choice" id="tune-right">오른쪽 👉</button>
    </div>
    <button class="big-btn btn-soft" id="tune-none">잘 모르겠어요 (골고루 움직이기)</button>
    <button class="big-btn btn-soft" id="tune-back">← 돌아가기</button>
  </div>
</div>

<!-- ══════════ 설정 완료 화면 ══════════ -->
<div class="screen card-wrap" id="scr-tuned">
  <div class="card">
    <div class="home-icon">🧭</div>
    <h1>맞춤 설정 완료</h1>
    <p class="sub" id="tuned-msg"></p>
    <button class="big-btn btn-start" id="btn-start2">▶ 바로 시작하기</button>
    <button class="big-btn btn-soft" id="btn-home1">🏠 처음으로</button>
  </div>
</div>

<!-- ══════════ 게임 화면 ══════════ -->
<div class="screen" id="scr-game">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="chip">⏱️ <span id="hud-time">60</span><small>초</small></div>
    <div class="chip">🧸 <span id="hud-score">0</span><small>개</small></div>
    <div class="chip" id="hud-focus" style="display:none;">🎯 <span id="hud-focus-txt"></span></div>
  </div>
  <div id="toast"></div>
  <button id="btn-quit">그만하기</button>
</div>

<!-- ══════════ 결과 화면 ══════════ -->
<div class="screen card-wrap" id="scr-end">
  <div class="card">
    <div class="result-icon" id="end-icon"></div>
    <h1 id="end-title">참 잘하셨어요!</h1>
    <p class="score-line">만난 장난감 <b id="end-score">0</b> 개</p>
    <p class="sub" id="end-msg"></p>
    <button class="big-btn btn-start" id="btn-again">🔄 한 번 더</button>
    <button class="big-btn btn-soft" id="btn-home2">🏠 처음으로</button>
  </div>
</div>

const CONFIG = {
  speeds:        { slow: 0.14, mid: 0.20, fast: 0.28 },  // 화면 짧은 변 대비 초당 이동 비율
  minHopRatio:   0.42,   // 한 번에 최소 이 비율(짧은 변 기준)만큼 크게 이동
  minLegSec:     1.4,    // 한 구간 최소 시간
  maxLegSec:     5.0,    // 한 구간 최대 시간
  restSec:       0.55,   // 도착 후 잠깐 쉬는 시간
  strongSideAmp: 0.5,    // 반대쪽 진폭 = 집중쪽의 1/2 (= 집중쪽이 2배)
  pattern:       ["W","C","W","S","W","S"], // 방문 3:2 (W=집중쪽, S=반대쪽, C=가운데)
  blinkMs:       420     // 캐릭터 두 모습 교대 간격
};

/* ─────────── 엔진 (수정 불필요) ─────────── */
(function(){
  "use strict";

  /* 테마 자동 적용 */
  const $ = id => document.getElementById(id);
  document.title = THEME.title;
  const rt = document.documentElement.style;
  rt.setProperty("--bg", THEME.colors.bg);
  rt.setProperty("--panel", THEME.colors.panel);
  rt.setProperty("--accent", THEME.colors.accent);
  rt.setProperty("--accent2", THEME.colors.accent2);
  $("home-icon").textContent = THEME.homeIcon;
  /* 그림 캐릭터 준비 (v1 게임의 charSVG 방식과 동일, 실패 시 이모지 대체) */
  let charImgs = null;
  if(THEME.charSVG && THEME.charSVG.length){
    charImgs = THEME.charSVG.map(function(s){
      const im = new Image();
      im.src = "data:image/svg+xml;utf8," + encodeURIComponent(s);
      return im;
    });
    $("home-icon").innerHTML = '<img style="height:64px;vertical-align:middle" alt="" src="' + charImgs[0].src + '"> <img style="height:56px;vertical-align:middle" alt="" src="' + charImgs[1].src + '">';
  }
  $("home-title").textContent = THEME.title;
  $("home-sub").innerHTML = THEME.homeSub;
  $("disclaimer").textContent = THEME.disclaimer;
  $("end-icon").textContent = THEME.charFrames[0];
  if(THEME.charSVG && THEME.charSVG.length){
    $("end-icon").innerHTML = '<img style="height:64px" alt="" src="data:image/svg+xml;utf8,' + encodeURIComponent(THEME.charSVG[0]) + '">';
  }

  /* 상태 */
  const state = {
    speedKey:"mid", timeKey:60, focus:null,   // focus: "left" | "right" | null
    playing:false, startAt:0, score:0, patIdx:0,
    x:0, y:0,
    leg:null,      // { x0,y0,x1,y1, t0(ms), dur(ms) }
    restUntil:0,
    item:null      // { emoji, x, y, bornAt }
  };

  /* 화면 전환 */
  function show(id){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
    $(id).classList.add("on");
  }

  /* 선택 버튼 묶음 */
  function bindChoiceRow(rowId, onPick){
    const row = $(rowId);
    row.querySelectorAll(".choice").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        row.querySelectorAll(".choice").forEach(b=>b.classList.remove("sel"));
        btn.classList.add("sel");
        onPick(btn.dataset.v);
      });
    });
  }
  bindChoiceRow("row-speed", v => state.speedKey = v);
  bindChoiceRow("row-time",  v => state.timeKey = parseInt(v,10));

  /* 맞춤 설정 */
  function setFocus(side){
    state.focus = side;
    const note = $("focus-note");
    if(side){
      const k = side==="left" ? "왼쪽" : "오른쪽";
      note.textContent = "🎯 지금은 「" + k + " 집중 모드」 입니다";
      $("tuned-msg").innerHTML = THEME.tunedMsg.replace("{쪽}", k);
      show("scr-tuned");
    }else{
      note.textContent = "🎯 골고루 움직이기 모드입니다";
      show("scr-home");
    }
  }
  $("btn-tune").addEventListener("click", ()=>show("scr-tune"));
  $("tune-left").addEventListener("click",  ()=>setFocus("left"));
  $("tune-right").addEventListener("click", ()=>setFocus("right"));
  $("tune-none").addEventListener("click",  ()=>setFocus(null));
  $("tune-back").addEventListener("click",  ()=>show("scr-home"));
  $("btn-home1").addEventListener("click",  ()=>show("scr-home"));
  $("btn-home2").addEventListener("click",  ()=>show("scr-home"));

  /* ── 소리: AudioContext는 공유 1개만 (재생성 금지) ── */
  let audioCtx = null;
  function getAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function ding(freqs){
    const ac = getAudio(); if(!ac) return;
    const t = ac.currentTime;
    freqs.forEach((f,i)=>{
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i*0.09);
      g.gain.exponentialRampToValueAtTime(0.18, t + i*0.09 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.09 + 0.28);
      o.connect(g); g.connect(ac.destination);
      o.start(t + i*0.09); o.stop(t + i*0.09 + 0.32);
    });
  }
  const sndCollect = ()=>ding([660, 880]);
  const sndStart   = ()=>ding([523, 659, 784]);
  const sndEnd     = ()=>ding([784, 659, 523]);

  /* ── 캔버스: 고해상도 DPI + resize 대응 ── */
  const cv = $("cv"), ctx = cv.getContext("2d");
  let vw = 0, vh = 0;
  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = window.innerWidth; vh = window.innerHeight;
    cv.width  = Math.round(vw * dpr);
    cv.height = Math.round(vh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    /* 창 크기가 바뀌어도 캐릭터가 화면 안에 남도록 보정 */
    const m = margin();
    state.x = Math.min(Math.max(state.x, m), vw - m);
    state.y = Math.min(Math.max(state.y, m), vh - m);
    if(state.leg){
      state.leg.x1 = Math.min(Math.max(state.leg.x1, m), vw - m);
      state.leg.y1 = Math.min(Math.max(state.leg.y1, m), vh - m);
    }
  }
  window.addEventListener("resize", resize);

  function charSize(){ return Math.max(52, Math.min(vw, vh) * 0.11); }
  function margin(){ return charSize() * 0.85; }

  /* ── 다음 목표 지점 (비대칭 3:2 + 진폭 2배) ── */
  function nextTarget(){
    const m = margin(), cx = vw / 2;
    const full = Math.max(40, cx - m);           // 가운데→가장자리 최대 거리
    const dirStrong = state.focus === "left" ? -1 : 1;
    let x;
    if(state.focus){
      const zone = CONFIG.pattern[state.patIdx % CONFIG.pattern.length];
      state.patIdx++;
      if(zone === "W"){        // 집중쪽: 멀리 (진폭 100%)
        x = cx + dirStrong * full * (0.55 + Math.random() * 0.45);
      }else if(zone === "S"){  // 반대쪽: 절반 진폭
        x = cx - dirStrong * full * CONFIG.strongSideAmp * (0.45 + Math.random() * 0.55);
      }else{                   // 가운데
        x = cx + (Math.random() - 0.5) * full * 0.35;
      }
    }else{
      /* 골고루: 왼/가운데/오른쪽을 무작위로 넓게 */
      const r = Math.random();
      if(r < 0.4)      x = m + Math.random() * full * 0.5;
      else if(r < 0.8) x = vw - m - Math.random() * full * 0.5;
      else             x = cx + (Math.random() - 0.5) * full * 0.5;
    }
    let y = m + Math.random() * Math.max(10, vh - 2 * m);

    /* 이동이 너무 짧으면 위/아래 반대편으로 보내 크게(사선) 움직이게 함 */
    const minD = Math.min(vw, vh) * CONFIG.minHopRatio;
    if(Math.hypot(x - state.x, y - state.y) < minD){
      y = (state.y < vh / 2)
        ? vh - m - Math.random() * vh * 0.15
        : m + Math.random() * vh * 0.15;
    }
    x = Math.min(Math.max(x, m), vw - m);
    y = Math.min(Math.max(y, m), vh - m);
    return { x, y };
  }

  function startLeg(now){
    const t = nextTarget();
    const dist = Math.hypot(t.x - state.x, t.y - state.y);
    const pxPerSec = Math.min(vw, vh) * CONFIG.speeds[state.speedKey];
    let sec = dist / Math.max(1, pxPerSec);
    sec = Math.min(Math.max(sec, CONFIG.minLegSec), CONFIG.maxLegSec);
    state.leg = { x0: state.x, y0: state.y, x1: t.x, y1: t.y, t0: now, dur: sec * 1000 };
  }

  const easeInOut = p => 0.5 - 0.5 * Math.cos(Math.PI * p);

  /* ── 게임 시작/종료 ── */
  function startGame(){
    show("scr-game");
    resize();
    state.playing = true;
    state.startAt = Date.now();
    state.score = 0;              // 재시작 시 점수 초기화
    state.patIdx = 0;
    state.item = null;
    state.restUntil = 0;
    state.x = vw / 2; state.y = vh / 2;
    state.leg = null;
    $("hud-score").textContent = "0";
    $("hud-time").textContent = String(state.timeKey);
    if(state.focus){
      $("hud-focus").style.display = "";
      $("hud-focus-txt").textContent = (state.focus==="left"?"왼쪽":"오른쪽") + " 집중";
    }else{
      $("hud-focus").style.display = "none";
    }
    /* 전체화면 시도 (안 되면 그냥 진행) */
    const el = document.documentElement;
    if(el.requestFullscreen){ el.requestFullscreen().catch(()=>{}); }
    sndStart();
    toast(THEME.startMsg, 2600);
    requestAnimationFrame(tick);
  }
  function endGame(quit){
    state.playing = false;
    if(document.fullscreenElement && document.exitFullscreen){
      document.exitFullscreen().catch(()=>{});
    }
    $("end-score").textContent = String(state.score);
    $("end-title").textContent = quit ? "수고하셨어요!" : "참 잘하셨어요!";
    $("end-msg").textContent =
      THEME.resultMsgs[Math.floor(Math.random() * THEME.resultMsgs.length)];
    sndEnd();
    show("scr-end");
  }
  $("btn-start").addEventListener("click", startGame);
  $("btn-start2").addEventListener("click", startGame);
  $("btn-again").addEventListener("click", startGame);
  $("btn-quit").addEventListener("click", ()=>endGame(true));

  /* ── 안내 말풍선 ── */
  let toastTimer = 0;
  function toast(msg, ms){
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove("show"), ms);
  }

  /* ── 매 프레임: 위치는 항상 '실제 경과 시간'으로 계산 ── */
  function tick(){
    if(!state.playing) return;
    const now = Date.now();

    /* 남은 시간 (실시간 기준) */
    const remain = state.timeKey - (now - state.startAt) / 1000;
    $("hud-time").textContent = String(Math.max(0, Math.ceil(remain)));
    if(remain <= 0){ endGame(false); return; }

    /* 이동 로직 */
    if(state.leg){
      const p = Math.min(1, (now - state.leg.t0) / state.leg.dur);
      const e = easeInOut(p);
      state.x = state.leg.x0 + (state.leg.x1 - state.leg.x0) * e;
      state.y = state.leg.y0 + (state.leg.y1 - state.leg.y0) * e;
      if(p >= 1){
        /* 도착: 장난감 등장 + 점수 */
        state.item = {
          emoji: THEME.items[Math.floor(Math.random() * THEME.items.length)],
          x: state.x, y: state.y - charSize() * 0.75, bornAt: now
        };
        state.score++;
        $("hud-score").textContent = String(state.score);
        sndCollect();
        state.leg = null;
        state.restUntil = now + CONFIG.restSec * 1000;
      }
    }else if(now >= state.restUntil){
      startLeg(now);
    }

    draw(now);
    requestAnimationFrame(tick);
  }

  /* ── 그리기 ── */
  function draw(now){
    ctx.clearRect(0, 0, vw, vh);
    const cs = charSize();

    /* 후광 — 반투명 붓 사용 후 반드시 복원 */
    ctx.save();
    const halo = ctx.createRadialGradient(state.x, state.y, cs*0.1, state.x, state.y, cs*0.45 + cs*0.35);
    halo.addColorStop(0, "rgba(255, 255, 255, 0.95)");
    halo.addColorStop(0.72, "rgba(255, 255, 255, 0.88)");
    halo.addColorStop(1, "rgba(255, 255, 255, 0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(state.x, state.y, cs*0.45 + cs*0.35, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;   // 붓 초기화 (이중 안전장치)

    /* 그림자 */
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = "#4A3B2A";
    ctx.beginPath();
    ctx.ellipse(state.x, state.y + cs*0.52, cs*0.36, cs*0.10, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;

    /* 장난감 (도착 지점에서 잠깐 떠오름) */
    if(state.item){
      const age = now - state.item.bornAt;
      if(age > 900){ state.item = null; }
      else{
        ctx.save();
        ctx.globalAlpha = age < 700 ? 1 : 1 - (age - 700) / 200;
        ctx.font = Math.round(cs*0.55) + "px sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(state.item.emoji, state.item.x, state.item.y - age * 0.03);
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }

    /* 캐릭터: 두 모습 깜빡깜빡 교대 + 아장아장 흔들림 */
    const wob = Math.sin(now / 160) * (state.leg ? cs*0.03 : 0);
    let charDrawn = false;
    if(charImgs){
      const im = charImgs[Math.floor(now / CONFIG.blinkMs) % charImgs.length];
      if(im.complete && im.naturalWidth > 0){
        ctx.drawImage(im, state.x - cs/2, state.y - cs/2 + wob, cs, cs);
        charDrawn = true;
      }
    }
    if(!charDrawn){
      const frame = THEME.charFrames[Math.floor(now / CONFIG.blinkMs) % THEME.charFrames.length];
      ctx.font = Math.round(cs) + "px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(frame, state.x, state.y + wob);
    }

    /* 집중 방향 표시 (🎯, 화면 가장자리) */
    if(state.focus){
      ctx.font = Math.round(cs*0.42) + "px sans-serif";
      const ex = state.focus === "left" ? margin()*0.6 : vw - margin()*0.6;
      ctx.fillText("🎯", ex, vh/2);
    }
  }

  resize();
})();
</script>
</body>
</html>
