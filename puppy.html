<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>뉴로 포커스 · 아기의 과일 모험</title>
<style>
:root{
  --bg:        #F6EEDF;   
  --panel:     #FFFDF6;   
  --ink:       #40342A;   
  --ink-soft:  #8D7C67;   /* 안내 문구용 회색 (삭제되어 있어 복원) */
  --line:      #E7DBC5;   
  --green:     #5E7D4F;   
  --orange:    #E8913F;   
  --radius:    24px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%; overflow:hidden; overscroll-behavior:none}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui, sans-serif;
  display:flex;justify-content:center;
}
/* ★ 화면에 정확히 맞춤(높이 고정) — 게임 영역이 스크롤 아래로 잘리는 문제 차단 */
#app{width:100%; height:100dvh; padding:10px; position:relative; display:flex; flex-direction:column; overflow:hidden}

.screen{display:none;animation:fadeIn .25s ease;flex:1;min-height:0;overflow-y:auto}
.screen.active{display:flex;flex-direction:column}
#screen-game{overflow:hidden} /* 게임 화면은 절대 스크롤되지 않음 */
/* 홈·설정·결과 화면은 가운데 860px 폭으로 (게임 화면은 전체 폭 그대로) */
.screen:not(#screen-game){width:min(570px,100%); margin-left:auto; margin-right:auto;}
/* 홈 화면 세로 여백 축소 — 글자 크기는 그대로, 한 화면 수납용 */
#screen-home h1{margin-top:0}
#screen-home .sub.mt14{margin-top:4px}
#screen-home .card.mt24{margin-top:8px; padding:10px 20px}
#screen-home .btn{padding:12px}
#screen-home .btn.ghost{padding:9px}
#screen-home .btn.mt24, #screen-home .btn.mt14{margin-top:8px}
#screen-home #legalNote{margin-top:6px !important}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

h1{font-size:36px; text-align:center; margin-top:10px; letter-spacing:-1px}
.sub{color:var(--ink-soft);font-size:19px;line-height:1.6;text-align:center}
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:24px;text-align:center}
.btn{
  display:block;width:100%;padding:20px;border:none;border-radius:20px;
  font-size:24px;font-weight:700;cursor:pointer;color:#fff;background:var(--green);
}
.btn.orange{background:var(--orange)}
.btn.ghost{background:var(--panel);color:var(--ink);border:2px solid var(--line);font-size:18px;padding:12px}

/* HUD (게임 중엔 최대한 컴팩트하게 — 세로 공간 확보) */
#hud{display:flex;justify-content:space-around;align-items:center;margin-bottom:8px}
.hud-chip{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:7px 18px;font-size:20px;font-weight:800}
.hud-chip small{display:block;font-size:13px;color:#8D7C67;text-align:center}

/* 게임 영역 - 항상 남은 화면 공간에 정확히 맞음 (화면 밖으로 절대 안 나감) */
#gameWrap{position:relative;flex:1;min-height:0;border-radius:var(--radius);overflow:hidden;border:2px solid var(--line);background:#FBF5E8}
#gameCanvas{display:block;width:100%;height:100%}

#coachToast{
  position:absolute;top:15px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#FFF9EE;font-size:20px;font-weight:700;
  padding:12px 24px;border-radius:99px;opacity:0;transition:opacity .3s;z-index:5;
}
#coachToast.show{opacity:.95}
.result-big{font-size:54px;font-weight:900;color:var(--orange);text-align:center;margin:15px 0}
.mt14{margin-top:14px}.mt24{margin-top:24px}
</style>
</head>
<body>
<div id="app">

  <!-- ════════════════ [1] 홈 화면 ════════════════ -->
  <section class="screen active" id="screen-home">
    <h1 id="homeTitle"></h1>
    <p class="sub mt14" id="homeSub"></p>
    
    <div class="card mt24" style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
      <div style="font-size:80px;line-height:1;" id="homeIcon"></div>
      <p class="sub mt14" style="color:var(--ink); font-weight:700" id="weakSideMsg"></p>
    </div>

    <button class="btn mt24" id="btnLR" onclick="startGame('lr')"></button>
    <button class="btn orange mt14" id="btnUD" onclick="startGame('ud')"></button>
    <button class="btn ghost mt24" onclick="showScreen('screen-diag')">🧭 1분 게임 맞춤 설정</button>
    <p class="sub" id="legalNote" style="font-size:13px;margin-top:12px;opacity:.7">본 게임은 의료기기가 아니며, 질병의 진단·치료·예방을 목적으로 하지 않는 오락용 콘텐츠입니다. 화면 속 움직임을 따라보며 좌우·위아래로 눈을 움직이는 활동을 돕는 놀이형 콘텐츠입니다.</p>
  </section>

  <!-- ════════════════ [2] 맞춤 설정 화면 ════════════════ -->
  <section class="screen" id="screen-diag">
    <h1>게임 맞춤 설정</h1>
    <p class="sub mt14">스트레칭했을 때의 느낌을 알려주세요.<br>게임 움직임이 나에게 맞게 조절됩니다.</p>
    <div class="card mt24" id="diagCard" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div style="font-size:64px" id="diagIllust">💪</div>
      <h2 id="diagQ" style="font-size:24px; margin:20px 0; line-height:1.5"></h2>
      <button class="btn ghost mt14" onclick="diagAnswer('left')">왼쪽이 뻣뻣해요</button>
      <button class="btn ghost mt14" onclick="diagAnswer('right')">오른쪽이 뻣뻣해요</button>
      <button class="btn ghost mt14" onclick="diagAnswer('same')">좌우 비슷해요</button>
    </div>
  </section>

  <!-- ════════════════ [3] 맞춤 설정 완료 화면 ════════════════ -->
  <section class="screen" id="screen-diagresult">
    <h1>맞춤 설정 완료</h1>
    <div class="card mt24" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <div style="font-size:72px">🧭</div>
      <p class="sub mt14" id="diagResultText" style="color:var(--ink); font-weight:600; text-align:left; line-height:1.6"></p>
    </div>
    <button class="btn mt24" onclick="startGame('lr')">🎮 바로 게임 시작 (좌우 보기)</button>
    <button class="btn ghost mt14" onclick="showScreen('screen-home')">확인 (홈으로)</button>
  </section>

  <!-- ════════════════ [4] 메인 게임 화면 ════════════════ -->
  <section class="screen" id="screen-game">
    <div id="hud">
      <div class="hud-chip"><small>⏱️ 남은 시간</small><span id="hudTime">60</span>초</div>
      <div class="hud-chip"><small>🎯 집중 방향</small><span id="hudFocus">균형</span></div>
      <div class="hud-chip"><small>⭐ 나의 점수</small><span id="hudScore">0</span>점</div>
    </div>
    <div id="gameWrap">
      <canvas id="gameCanvas"></canvas>
      <div id="coachToast"></div>
    </div>
    <button class="btn ghost mt14" onclick="quitGame()">그만하기</button>
  </section>

  <!-- ════════════════ [5] 결과 화면 ════════════════ -->
  <section class="screen" id="screen-result">
    <h1>참 잘하셨습니다!</h1>
    <div class="result-big" id="resScore">0점</div>
    <div class="card" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
      <p class="sub" id="resComment" style="color:var(--ink); font-weight:700; font-size:22px;"></p>
    </div>
    <button class="btn mt24" onclick="showScreen('screen-home')">집으로 돌아가기</button>
  </section>

</div>

let ctx = canvas.getContext('2d');
let gameWrap = document.getElementById('gameWrap');
let G = null;
let rafId = null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='screen-home') {
    var msg = document.getElementById('weakSideMsg');
    if(state.weakSide === 'left') msg.innerHTML = "💡 지금은 <b>오른쪽으로 더 크게, 더 자주(3:2)</b> 움직입니다. (오른쪽 집중 모드)";
    else if(state.weakSide === 'right') msg.innerHTML = "💡 지금은 <b>왼쪽으로 더 크게, 더 자주(3:2)</b> 움직입니다. (왼쪽 집중 모드)";
    else msg.innerHTML = THEME.homeMsg;
  }
}

/* 맞춤 설정 로직 */
const DIAG_QUESTIONS = [
  ['💪', '양팔을 뒤로 들어보세요.<br>어느 쪽이 더 뻣뻣하게 느껴지나요?'],
  ['🦵', '의자에 앉아 다리를 들어보세요.<br>어느 쪽이 더 무겁게 느껴지나요?']
];
let diagIdx = 0, diagVotes = {left:0, right:0, same:0};

function diagStart(){
  diagIdx = 0; diagVotes = {left:0, right:0, same:0};
  diagRender();
}
document.querySelector("button[onclick*='screen-diag']").addEventListener('click', diagStart);

function diagRender(){
  document.getElementById('diagIllust').textContent = DIAG_QUESTIONS[diagIdx][0];
  document.getElementById('diagQ').innerHTML = DIAG_QUESTIONS[diagIdx][1];
}

function diagAnswer(side){
  diagVotes[side]++;
  diagIdx++;
  if(diagIdx < DIAG_QUESTIONS.length){ diagRender(); return; }
  
  let result = 'balanced';
  if(diagVotes.left > diagVotes.right) result = 'left';
  else if(diagVotes.right > diagVotes.left) result = 'right';
  state.weakSide = result;
  
  let t = document.getElementById('diagResultText');
  if(result==='left'){
    t.innerHTML = '왼쪽이 더 뻣뻣하게 느껴지셨군요.<br><br>게임이 <b>오른쪽으로는 2배 크게, 3:2 비율로 더 자주</b> 움직이도록 맞춤 조절되었습니다. 게임 화면 오른쪽 끝의 🎯 표시가 집중 방향입니다.';
  } else if(result==='right'){
    t.innerHTML = '오른쪽이 더 뻣뻣하게 느껴지셨군요.<br><br>게임이 <b>왼쪽으로는 2배 크게, 3:2 비율로 더 자주</b> 움직이도록 맞춤 조절되었습니다. 게임 화면 왼쪽 끝의 🎯 표시가 집중 방향입니다.';
  } else {
    t.innerHTML = '좌우 느낌이 비슷하시군요!<br><br>캐릭터가 양쪽 끝을 골고루 넓게 왕복합니다.';
  }
  showScreen('screen-diagresult');
}

/* 효과음 (AudioContext는 1개만 재사용 — 매번 만들면 소리가 끊김) */
let sharedAudioCtx = null;
function playSound(freq, dur) {
  try {
    if(!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let audioCtx = sharedAudioCtx;
    if(audioCtx.state === 'suspended') audioCtx.resume();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e){}
}

/* 좌표를 최소~최대 범위 안에 가두는 도우미 */
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

let viewW = 0, viewH = 0; /* 논리(화면) 크기 — 게임 좌표는 항상 이 기준 */
function resizeCanvas(){
  const w = gameWrap.clientWidth, h = gameWrap.clientHeight;
  /* [안전장치] 게임 화면이 숨겨진 상태(크기 0)의 resize는 무시 — 좌표 오염 방지 */
  if(w < 50 || h < 50) return;
  viewW = w; viewH = h;
  /* ★ [선명도 수정] Windows 화면 배율(125%/150%)에 맞춰 고해상도로 렌더링 — 흐림 제거
     (최대 2배로 제한해 저사양 PC 성능 보호) */
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if(G){
    G.w = w; G.h = h;
    /* ★ 창 크기가 바뀌면 아기와 진행 중인 여정을 새 화면 안으로 재조정 */
    const m = CONFIG.itemSize + 10;
    G.x = clamp(G.x, m, G.w - m);
    G.y = clamp(G.y, m, G.h - m);
    if(G.j){
      G.j.tx = clamp(G.j.tx, m, G.w - m);
      G.j.ty = clamp(G.j.ty, m, G.h - m);
      /* 현재 위치에서 (보정된) 목표까지 여정을 새로 시작 */
      G.j.sx = G.x; G.j.sy = G.y;
      const dist = Math.max(1, Math.hypot(G.j.tx - G.x, G.j.ty - G.y));
      G.j.t0 = performance.now();
      G.j.dur = dist / CONFIG.baseSpeed * 1000;
    }
  }
}
window.addEventListener('resize', resizeCanvas); /* 창 크기 조절/화면 회전 대응 */

/* ★ 전체화면 도우미 — 위아래 모드의 세로 폭 최대 확보용
   (주소창·작업표시줄이 사라져 세로 공간이 크게 늘어남) */
function enterFull(){
  try{
    if(!document.fullscreenElement && document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().catch(function(){});
    }
  }catch(e){}
}
function exitFull(){
  try{
    if(document.fullscreenElement && document.exitFullscreen){
      document.exitFullscreen().catch(function(){});
    }
  }catch(e){}
}

function startGame(mode){
  lastMode = mode;
  /* ★ 위아래 모드는 자동 전체화면 — 세로 이동 폭이 크게 넓어짐 (ESC로 언제든 해제 가능) */
  if(mode === 'ud') enterFull();
  showScreen('screen-game');
  resizeCanvas();
  
  G = {
    mode: mode, w: viewW || canvas.width, h: viewH || canvas.height,
    x: (viewW || canvas.width)/2, y: (viewH || canvas.height)/2,
    dir: 1,
    score: 0, over: false,
    startT: performance.now(),   /* ★ 실제 시계 기준 시작 시각 — 타이머가 절대 느려지지 않음 */
    pausedAt: null,
    emoji: THEME.items[0],
    babyEmoji: THEME.charFrames[0],
    particles: [],
    lastFrame: performance.now(),
    slowFrames: 0, tipShown: false,
    step: 0,                      /* 3:2 비대칭 방문 패턴의 진행 위치 */
    j: null                       /* 현재 여정 {sx,sy,tx,ty,t0,dur} */
  };
  
  /* 🎯 집중 방향 표시 (맞춤 설정이 실제로 적용 중임을 화면에서 항상 확인 가능) */
  let focusTxt = '좌우 균형';
  if(mode === 'ud') focusTxt = '위아래 균형';
  else if(state.weakSide === 'left') focusTxt = '오른쪽 →';
  else if(state.weakSide === 'right') focusTxt = '← 왼쪽';
  document.getElementById('hudFocus').textContent = focusTxt;

  document.getElementById('hudScore').textContent = '0';
  document.getElementById('hudTime').textContent = CONFIG.gameSeconds;
  startJourney(G.x, G.y);
  if(mode === 'lr' && state.weakSide === 'left') coach("🎯 오른쪽으로 더 크게, 더 자주 갑니다!");
  else if(mode === 'lr' && state.weakSide === 'right') coach("🎯 왼쪽으로 더 크게, 더 자주 갑니다!");
  else if(mode === 'ud') coach("전체 화면으로 위아래 폭을 넓혔어요! 눈으로 천천히 따라가세요");
  else coach(THEME.startMsg);
  
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

/* 탭을 벗어났다 돌아오면 그 시간만큼 게임을 일시정지 처리 (시간 왜곡 방지) */
document.addEventListener('visibilitychange', function(){
  if(!G || G.over) return;
  if(document.hidden){
    G.pausedAt = performance.now();
  } else if(G.pausedAt){
    const gap = performance.now() - G.pausedAt;
    G.startT += gap;
    if(G.j) G.j.t0 += gap;
    G.lastFrame += gap;
    G.pausedAt = null;
  }
});

/* ★ [핵심 재설계] 다음 여정 시작 — 위치를 "실제 경과 시간의 비율"로 계산하는 방식.
   비대칭 원리 (15:10 비대칭 법칙):
   ① 빈도: 약한 방향 3회 : 잘 되는 방향 2회 (중앙 경유 1회 포함한 6단계 패턴)
   ② 진폭: 약한 방향은 화면 맨 끝(100%), 잘 되는 방향은 50%만 → 한눈에 보이는 차이 */
function startJourney(fromX, fromY) {
  let marginX = CONFIG.itemSize + 10;
  /* ★ 위아래 모드는 세로 공간이 귀하므로 여백을 최소화 (75→45px, 왕복 폭 +60px) */
  let marginY = (G.mode === 'ud') ? Math.round(CONFIG.itemSize / 2 + 12) : CONFIG.itemSize + 10;
  G.emoji = THEME.items[Math.floor(Math.random()*THEME.items.length)];
  
  let bias = null;
  if(state.weakSide === 'left') bias = 'right';   /* 왼쪽 뻣뻣 → 오른쪽을 강화 */
  if(state.weakSide === 'right') bias = 'left';   /* 오른쪽 뻣뻣 → 왼쪽을 강화 */

  let tx, ty;
  if(G.mode === 'lr') {
    let cx = G.w / 2;
    if(bias){
      /* 강화 방향(W)=끝까지, 반대(S)=진폭 50%, 중앙(C) 경유
         패턴 W,C,W,S,W,S 반복 → W:S = 3:2 (15:10 법칙) */
      const W = (bias === 'right') ? G.w - marginX : marginX;
      const S = (bias === 'right') ? cx - (cx - marginX) * CONFIG.strongSideAmp
                                   : cx + (G.w - marginX - cx) * CONFIG.strongSideAmp;
      const pattern = [W, cx, W, S, W, S];
      tx = pattern[G.step % pattern.length];
      G.step++;
      /* [안전장치] 현재 위치와 너무 가까운 목표면 다음 단계로 건너뜀 (제자리 뻥튀기 방지) */
      if(Math.abs(tx - fromX) < 60){
        tx = pattern[G.step % pattern.length];
        G.step++;
      }
    } else {
      /* 균형: 좌우 끝을 번갈아 */
      tx = (G.dir === 1) ? G.w - marginX : marginX;
      G.dir *= -1;
    }
    ty = G.h / 2;
  } else {
    /* 상하 모드는 자세 교정 목적 — 위아래 균등 */
    tx = G.w / 2;
    ty = (G.dir === 1) ? G.h - marginY : marginY;
    G.dir *= -1;
  }
  /* [안전장치] 목표는 어떤 경우에도 화면 여백 안쪽 */
  tx = clamp(tx, marginX, G.w - marginX);
  ty = clamp(ty, marginY, G.h - marginY);

  const dist = Math.max(1, Math.hypot(tx - fromX, ty - fromY));
  G.j = {
    sx: fromX, sy: fromY, tx: tx, ty: ty,
    t0: performance.now(),
    dur: dist / CONFIG.baseSpeed * 1000   /* 이동 시간(ms) = 거리 ÷ 속도 */
  };
}

function createExplosion(x, y) {
  for (let i = 0; i < 12; i++) {
    let angle = (Math.PI * 2 / 12) * i;
    let speed = 70 + Math.random() * 60;
    G.particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      alpha: 1.0,
      size: 4 + Math.random() * 5
    });
  }
}

/* 메인 루프 — 위치·타이머 모두 실제 시계 기준 (프레임 속도와 완전히 무관) */
function loop(now){
  if(!G || G.over) return;
  if(document.hidden){ rafId = requestAnimationFrame(loop); return; } /* 숨김 중엔 대기 */

  const frameGap = now - G.lastFrame;
  /* 저사양/절전 감지: 프레임이 계속 느리면 한 번만 안내 */
  if(frameGap > 50) G.slowFrames++; else G.slowFrames = Math.max(0, G.slowFrames - 2);
  if(G.slowFrames > 40 && !G.tipShown){
    G.tipShown = true;
    coach("💡 다른 탭을 닫거나 절전 모드를 끄면 더 부드러워요");
  }
  const dtFx = Math.min(0.1, frameGap/1000); /* 파티클 연출용 */
  G.lastFrame = now;

  /* ★ 아기 위치 = 여정 진행률(실제 시간 ÷ 이동 시간)로 직접 계산 */
  const j = G.j;
  let p = (now - j.t0) / j.dur;
  if(!isFinite(p)) p = 1;              /* [안전장치] 계산 오류 시 즉시 도착 처리 */
  p = clamp(p, 0, 1);
  G.x = j.sx + (j.tx - j.sx) * p;
  G.y = j.sy + (j.ty - j.sy) * p;

  if(p >= 1){
    /* 도착: 팡! + 즉시 다음 여정 */
    createExplosion(G.x, G.y);
    playSound(440, 0.05); setTimeout(() => playSound(880, 0.1), 30);
    G.score += 100;
    document.getElementById('hudScore').textContent = G.score;
    startJourney(G.x, G.y);
  } else {
    /* 아장아장 애니메이션도 실제 시간 기준 (0.14초마다 프레임 교체) */
    G.babyEmoji = THEME.charFrames[Math.floor(now / 140) % THEME.charFrames.length];
  }

  // 이펙트 업데이트
  for (let i = G.particles.length - 1; i >= 0; i--) {
    let pt = G.particles[i];
    pt.x += pt.vx * dtFx;
    pt.y += pt.vy * dtFx;
    pt.alpha -= dtFx * 2.0;
    if (pt.alpha <= 0) G.particles.splice(i, 1);
  }

  /* 그리기 */
  ctx.clearRect(0,0,G.w,G.h);
  
  // 가이드라인
  ctx.strokeStyle = 'rgba(141,124,103,0.04)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  if(G.mode === 'lr') { ctx.moveTo(0, G.h/2); ctx.lineTo(G.w, G.h/2); }
  else { ctx.moveTo(G.w/2, 0); ctx.lineTo(G.w/2, G.h); }
  ctx.stroke();

  /* 🎯 집중 방향 표시: 집중되는 쪽 끝에 은은한 초록 빛 + 조준 아이콘 */
  if(G.mode === 'lr' && (state.weakSide === 'left' || state.weakSide === 'right')){
    const focusX = (state.weakSide === 'left') ? G.w - 60 : 60;  /* 왼쪽 뻣뻣 → 오른쪽 끝 강조 */
    const grad = ctx.createRadialGradient(focusX, G.h/2, 10, focusX, G.h/2, 220);
    grad.addColorStop(0, 'rgba(94,125,79,0.10)');
    grad.addColorStop(1, 'rgba(94,125,79,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(focusX, G.h/2, 220, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#40342A';
    ctx.font = '34px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🎯', focusX, G.h/2 - 120);
  }
  
  // 파티클 그리기
  for (let i = 0; i < G.particles.length; i++) {
    let pt = G.particles[i];
    ctx.fillStyle = `rgba(232, 145, 63, ${pt.alpha})`;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
  }
  
  /* ★ [선명도 수정] 파티클/후광의 반투명 붓 상태가 남지 않도록,
     과일과 아기는 그리기 직전마다 붓을 '완전 불투명'으로 초기화 */
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#40342A';

  // 과일 그리기 (다음 목표지점에서 대기)
  ctx.font = CONFIG.itemSize + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(G.emoji, j.tx, j.ty);
  
  // 아기 후광(넓은 화면에서 눈이 놓치지 않도록 은은한 원)
  ctx.fillStyle = THEME.haloColor || 'rgba(232,145,63,0.10)';  /* 후광 색 (테마 지정 가능, 기본 주황) */
  ctx.beginPath(); ctx.arc(G.x, G.y, (THEME.charSize || CONFIG.babySize) * 0.45, 0, Math.PI * 2); ctx.fill(); /* 후광 — 캐릭터의 절반 크기로 은은하게 */

  /* 아기도 완전 불투명 붓으로 */
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#40342A';

  // 캐릭터 그리기 — THEME.charSVG(그림)가 있으면 그림으로, 없으면 이모지로
  const cSize = THEME.charSize || CONFIG.babySize;
  ctx.save();
  ctx.translate(G.x, G.y);
  ctx.rotate(Math.sin(now / 160) * 0.12);
  let drawn = false;
  if(charImgs){
    const fi = Math.floor(now / 160) % charImgs.length;
    const im = charImgs[fi];
    if(im.complete && im.naturalWidth > 0){
      ctx.drawImage(im, -cSize/2, -cSize/2, cSize, cSize);
      drawn = true;
    }
  }
  if(!drawn){
    ctx.font = cSize + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif';
    ctx.fillText(G.babyEmoji, 0, 0);
  }
  ctx.restore();

  /* ✨ 반짝 효과 (THEME.aura가 "sparkle"인 테마 전용 — 고고장 등) */
  if(THEME.aura === 'sparkle'){
    ctx.font = '22px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",serif';
    for(let i = 0; i < 6; i++){
      const a = now/500 + i * Math.PI/3;
      const r = cSize * 0.72 + 10 * Math.sin(now/300 + i*2);
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(now/160 + i*1.7);
      ctx.fillText('✨', G.x + Math.cos(a)*r, G.y + Math.sin(a)*r*0.8);
    }
    ctx.globalAlpha = 1; /* 붓 상태 복원 (선명도 유지) */
  }

  /* ★ 타이머 = 실제 경과 시간 — PC가 느려도 60초는 정확히 60초 */
  const left = CONFIG.gameSeconds - (now - G.startT) / 1000;
  if(left <= 0){ endSet(); return; }
  document.getElementById('hudTime').textContent = Math.max(0, Math.ceil(left));
  
  rafId = requestAnimationFrame(loop);
}

let coachTm = null;
function coach(msg){
  let t = document.getElementById('coachToast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(coachTm); coachTm = setTimeout(() => t.classList.remove('show'), 3000);
}

function endSet(){
  G.over = true;
  cancelAnimationFrame(rafId);
  exitFull(); /* 전체화면 자동 복귀 */
  playSound(523, 0.1);
  document.getElementById('resScore').textContent = G.score + ' 점';
  document.getElementById('resComment').textContent = THEME.resultMsg;
  showScreen('screen-result');
}

function quitGame(){
  if(G) G.over = true;
  cancelAnimationFrame(rafId);
  exitFull(); /* 전체화면 자동 복귀 */
  showScreen('screen-home');
}

/* ═══════ 테마 적용 (자동 실행 — 건드릴 필요 없음) ═══════ */
let charImgs = null; /* THEME.charSVG를 그림으로 변환해 보관 */
function applyTheme(){
  document.title = '뉴로 포커스 · ' + THEME.title;
  document.getElementById('homeTitle').textContent = THEME.title;
  document.getElementById('homeSub').innerHTML = THEME.homeSub;
  document.getElementById('homeIcon').textContent = THEME.homeIcon;
  document.getElementById('weakSideMsg').innerHTML = THEME.homeMsg;
  document.getElementById('btnLR').textContent = THEME.btnLR;
  document.getElementById('btnUD').textContent = THEME.btnUD;
  const map = {bg:'--bg', panel:'--panel', green:'--green', orange:'--orange'};
  for(const k in THEME.colors){
    if(map[k]) document.documentElement.style.setProperty(map[k], THEME.colors[k]);
  }
  /* 그림 캐릭터(charSVG)가 있으면: 게임용 이미지 준비 + 홈 화면에도 그림으로 표시 */
  if(THEME.charSVG && THEME.charSVG.length){
    charImgs = THEME.charSVG.map(function(s){
      const im = new Image();
      im.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
      return im;
    });
    document.getElementById('homeIcon').innerHTML =
      '<img style="height:100px;vertical-align:middle" alt="" src="' + charImgs[0].src + '">' +
      '<span style="font-size:60px;vertical-align:middle"> ' + (THEME.items[0] || '') + '</span>';
  }
}
applyTheme();
</script>
